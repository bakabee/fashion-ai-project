<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <pre id="output"></pre>
    <script>
        const { GLTFLoader } = THREE;
        const loader = new GLTFLoader();
        
        loader.load('public/models/master.glb', (gltf) => {
            const output = document.getElementById('output');
            const meshes = [];
            
            gltf.scene.traverse((obj) => {
                if (obj.isMesh) {
                    meshes.push({
                        name: obj.name,
                        visible: obj.visible,
                        geometry: obj.geometry ? 'yes' : 'no',
                        material: obj.material ? (Array.isArray(obj.material) ? obj.material.length : 1) : 0,
                    });
                }
            });
            
            output.innerHTML = 'Master.glb meshes:\n' + JSON.stringify(meshes, null, 2);
            
            // Find boat_bandeau
            const boat = gltf.scene.getObjectByName('boat_bandeau');
            output.innerHTML += '\n\nboat_bandeau search result: ' + (boat ? boat.name : 'NOT FOUND');
            if (boat) {
                output.innerHTML += '\n  Type: ' + boat.type;
                output.innerHTML += '\n  Visible: ' + boat.visible;
                output.innerHTML += '\n  Position: ' + boat.position.toArray().join(', ');
            }
        });
    </script>
</body>
</html>
